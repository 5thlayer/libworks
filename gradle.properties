# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties. The build, the mods.toml and the scripts read the Library's names from here; the
# Java package, MOD_ID and settings.gradle spell mod_id too (ModIdTest checks MOD_ID).
mod_id = examplelib
mod_name = Example Library
mod_description = A 5thlayer Library started from the libworks template.
mod_version = 0.1.0
maven_group = io.github.5thlayer
archives_name = examplelib

# Minecraft properties
minecraft_version = 26.1.2

# Dependencies
neoforge_version = 26.1.2.77

# Modrinth and CurseForge (docs/agents/releases.md). A Library that never goes to the sites leaves
# both projects empty, and scripts/release.sh skips the upload. The dependencies are the required
# ones, comma separated: Modrinth project ids, CurseForge slugs. upload_release_type is release, beta or
# alpha for every upload, or empty for beta below 1.0 and release from it; CurseForge's app lists a
# project only once it has a release.
modrinth_project_id =
curseforge_project_id =
modrinth_dependencies =
curseforge_dependencies =
upload_release_type =
