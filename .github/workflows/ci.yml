# Builds and tests every push through the Module CI every Module calls (ADR 0003). It never
# publishes: a Module's jar reaches a Consumer only through ~/.m2, and Modrinth and CurseForge,
# only from a maintainer's machine (docs/agents/releases.md). The template builds its plugin from
# plugin/; fill-template.sh points a Module at module-ci.yml at the plugin's tag instead.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/module-ci.yml

  # The template's own: the upload, upstream and fill-template steps' tests, on localhost only.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover scripts/tests
