# The CI every Module calls (ADR 0003), at the tag of the plugin it applies:
#   jobs:
#     ci:
#       uses: 5thlayer/libworks/.github/workflows/module-ci.yml@plugin-v<version>
#       with:
#         plugin-version: <version>
# It never publishes outside the runner: a jar reaches the Pack only through a maintainer's ~/.m2.
name: Module CI

on:
  workflow_call:
    inputs:
      plugin-version:
        description: The libworks plugin version the Module applies; its tag plugin-v<version> is built.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The plugin is taken from ~/.m2, which a runner starts without, so it is built from its tag.
      - uses: actions/checkout@v7
        with:
          repository: 5thlayer/libworks
          ref: plugin-v${{ inputs.plugin-version }}
          path: .libworks

      - run: ./gradlew :plugin:publishToMavenLocal
        working-directory: .libworks

      # Each upstream Library the Module declares, from its tag, the same way.
      - run: ./gradlew -q libworksUpstreams | sh .libworks/.github/scripts/build-upstreams.sh

      # The build, with the JUnit tests.
      - run: ./gradlew build

      # A headless server that runs the game tests and names each one; it fails if it ran none.
      - run: ./gradlew runGameTestServer

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report
          path: |
            build/reports/gametest.xml
            build/reports/tests/
            run/gametest/logs/
          if-no-files-found: ignore

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
