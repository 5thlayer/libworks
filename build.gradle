// The Module build, every piece of it from the libworks convention plugin (libworks ADR 0003):
// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing, and the release, upload and buildGametestStructures tasks.
// The template builds the plugin from plugin/; fill-template.sh pins a Module to the released version.
plugins {
    id 'io.github.5thlayer.libworks.module'
}

// What the Module requires of other Modules, each as a range (libworks ADR 0003):
libworks {
    // upstream('groundworks') { range = '[0.4.0,0.5)' }
    // Nested by jar-in-jar: the Works tab the whole suite shares, and from 0.1.8 libworks-gametest on
    // the game tests' classpath (5thlayer/libworks ADR 0008).
    runtime = '0.1.8'
}

// libworks-runtime and libworks-gametest come from ~/.m2, the one repository the plugin gives every
// io.github.5thlayer module (libworks#18). CI builds the runtime's tag there first.

// The template's own checks run its plugin's tests too; a Module has no plugin/ build.
if (gradle.includedBuilds.any { it.name == 'plugin' }) {
    tasks.named('check') { dependsOn gradle.includedBuild('plugin').task(':check') }
}
