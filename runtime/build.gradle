plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

group = maven_group
version = runtime_version
base.archivesName = 'libworks-runtime'

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

sourceSets {
    // libworks-gametest, the checks a Module's game tests share (#25): a jar of its own, never nested.
    testkit {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // The game test lives beside the jar, not in it.
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.testkit.output
        runtimeClasspath += sourceSets.main.output + sourceSets.testkit.output
    }
    test {
        compileClasspath += sourceSets.testkit.output
        runtimeClasspath += sourceSets.testkit.output
    }
}

def gameTestReport = layout.buildDirectory.file('reports/gametest.xml').get().asFile

// A mod of its own, nested by Modules. NeoForge is compile-only here: FML provides it.
neoForge {
    version = neoforge_version
    addModdingDependenciesTo sourceSets.test
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.testkit

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            programArguments.addAll '--tests', 'libworks:*', '--report', gameTestReport.absolutePath
            systemProperty 'libworks.gametest', 'true'
        }
    }

    mods {
        libworks {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            sourceSet sourceSets.testkit
        }
    }

    // JUnit under FML, which a FluidStack needs to exist.
    unitTest {
        enable()
        testedMod = mods.libworks
    }
}

// Same report check as the template's: a run that ran no test is not a pass.
tasks.named('runGameTestServer') {
    ignoreExitValue = true
    doFirst {
        gameTestReport.delete()
        gameTestReport.parentFile.mkdirs()
    }
    doLast {
        if (!gameTestReport.exists()) throw new GradleException("The game test server wrote no report at $gameTestReport")
        def cases = new groovy.xml.XmlSlurper().parse(gameTestReport).'**'.findAll { it.name() == 'testcase' }
        if (cases.isEmpty()) throw new GradleException('The game test server ran no tests')
        cases.each { logger.lifecycle("${it.failure.size() ? 'FAILED' : 'passed'}  ${it.@name}") }
        def failed = cases.count { it.failure.size() }
        if (failed) throw new GradleException("$failed of ${cases.size()} game tests failed")
    }
}

repositories {
    // EMI, whose ghost stack provider the runtime registers; the runtime runs without it (ADR 0007).
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade, which the machine providers build against; the runtime runs without it (ADR 0006).
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// The Jade the Modules build against. compileOnly: the game test server runs without it, which keeps
// the runtime from loading a Jade class of its own accord (ADR 0006).
def jade = 'maven.modrinth:jade:26.1.11+neoforge'
// The EMI the Modules build against, compileOnly as Jade is: only EMI loads the runtime's EMI
// plugin (ADR 0007).
def emi = 'curse.maven:emi-unofficial-port-1544558:8630349'

dependencies {
    compileOnly jade
    testImplementation jade
    compileOnly emi
    testImplementation emi

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// A mod, not a library: no FMLModType. Two Modules nesting different versions resolve to the
// highest in range, and FML loads that copy once.
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': runtime_version)
    from(rootDir) { include 'LICENSE', 'LICENSES/MIT.txt' }
}

// A game library, not a mod: FML loads it beside Minecraft on a Module's dev runs, and no player
// ever has it.
def testkitId = 'libworks-gametest'

def testkitJar = tasks.register('testkitJar', Jar) {
    archiveBaseName = testkitId
    from sourceSets.testkit.output
    from(rootDir) { include 'LICENSE', 'LICENSES/MIT.txt' }
    manifest.attributes(
            'FMLModType': 'GAMELIBRARY',
            'Automatic-Module-Name': 'io.github._5thlayer.libworks.testkit',
            'Implementation-Version': runtime_version)
}

def testkitSourcesJar = tasks.register('testkitSourcesJar', Jar) {
    archiveBaseName = testkitId
    archiveClassifier = 'sources'
    from sourceSets.testkit.allSource
}

// The jar and its sources as a component of their own, so the publication carries Gradle module
// metadata as the runtime's does. No dependency on the runtime: a Module nests its own (ADR 0008).
def testkitVariant = { String name, String category, task ->
    configurations.create(name) {
        canBeConsumed = true
        canBeResolved = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, category))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            if (category == Category.DOCUMENTATION) {
                attribute(DocsType.DOCS_TYPE_ATTRIBUTE, objects.named(DocsType, DocsType.SOURCES))
            } else {
                attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
        outgoing.artifact(task)
    }
}
def testkitComponent = services.get(SoftwareComponentFactory).adhoc('testkit')
testkitComponent.addVariantsFromConfiguration(testkitVariant('testkitElements', Category.LIBRARY, testkitJar)) {
    mapToMavenScope('runtime')
}
testkitComponent.addVariantsFromConfiguration(testkitVariant('testkitSourcesElements', Category.DOCUMENTATION, testkitSourcesJar)) {
    mapToOptional()
}

processResources {
    def props = [
            version: runtime_version, minecraft_version: minecraft_version, neoforge_version: neoforge_version,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
        // Same version as the runtime it checks; a Module takes both from one range.
        gametest(MavenPublication) {
            artifactId = testkitId
            from testkitComponent
        }
    }
}

// As the root's: a version in the local maven repository never changes, so a fix is the next patch.
// Both jars are checked once, before either publishes, so neither goes out while the other's version
// is taken.
def published = { File root -> [base.archivesName.get(), testkitId]
        .collect { new File(root, "${maven_group.replace('.', '/')}/$it/$runtime_version") }
        .findAll { it.exists() } }
def taken = null
tasks.withType(PublishToMavenLocal).configureEach {
    def local = repositories.mavenLocal()
    repositories.remove(local)
    def root = new File(local.url.path)
    doFirst {
        if (taken == null) taken = published(root)
        if (taken) throw new GradleException(
                "$runtime_version is already in ${taken.join(' and ')}, and a published version never changes: bump runtime_version")
    }
}
