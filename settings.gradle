pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'examplelib'

// The runtime jar other Modules nest (ADR-0128); fill-template.sh removes it from a Module.
include 'runtime'
